[package]
name = "nsh-platform-harmonyos"
description = "A community-maintained NSH platform: runs Native Shell apps on HarmonyOS and OpenHarmony with ArkUI native views."
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true

[lints]
workspace = true

[features]
default = ["editor", "emoji-picker", "highlight", "math", "plot", "rich-editor", "term", "zlib", "crypto"]
dev = ["dep:nsh-dev", "dep:url"]
# The large parts of `nsh/base`, as NSH's Android and iOS backends name them.
# An app that imports one the library was built without fails at the import,
# naming it.
# `Editor` and `DiffView`, with ropey and imara-diff.
editor = ["nsh-base/editor"]
# `RichEditor`, its schema, session and plugin classes.
rich-editor = ["nsh-base/rich-editor"]
# The charts: `nsh/base/plot`.
plot = ["nsh-base/plot"]
# `Terminal` and its emulator: `vte`.
term = ["nsh-base/term"]
# Highlighted code in `TextView` and the `Editor` (syntect). Without it, plain.
highlight = ["nsh-base/highlight"]
# `TextView`'s formulas typeset natively (RaTeX and the KaTeX fonts). Without
# it a formula shows as its TeX, or as the app's `renderMath`.
math = ["nsh-base/math"]
# `EmojiPicker`, with Unicode's emoji and their English names (about 440 kB).
emoji-picker = ["nsh-base/emoji-picker"]
# The standard JS module `zlib`: deflate, gzip, brotli and zstd.
zlib = ["nsh-engine/zlib"]
# The standard JS module `crypto` and the globals of Web Crypto.
crypto = ["nsh-engine/crypto"]
# Linked enhancements raise the minimum supported runtime API.
api-23 = [
  "ohos-arkui-binding/accessibility",
  "ohos-arkui-binding/api-23",
  "dep:ohos-accessibility-binding",
  "ohos-accessibility-binding/api-23",
]
api-26 = ["api-23", "ohos-arkui-binding/api-26"]

[target.'cfg(target_env = "ohos")'.dependencies]
nsh-core = { workspace = true, features = ["svg", "shader", "glsl"] }
getrandom = { workspace = true, features = ["std"] }
nsh-package.workspace = true
nsh-dev = { workspace = true, features = ["client"], optional = true }
url = { workspace = true, optional = true }
nsh-engine = { workspace = true, features = ["js"] }
nsh-base.workspace = true
napi-ohos.workspace = true
napi-derive-ohos.workspace = true
tokio = { workspace = true, features = ["rt"] }
ohos-arkui-binding = { workspace = true, features = ["image"] }
ohos-accessibility-binding = { workspace = true, optional = true }
ohos-device-binding.workspace = true
ohos-display-binding.workspace = true
ohos-drawing-binding.workspace = true
ohos-native-image-binding.workspace = true
ohos-resource-manager-binding.workspace = true
ohos-vsync-binding.workspace = true
ohos-web-binding.workspace = true
ohos-window-manager-binding.workspace = true
ohos-image-native-binding.workspace = true
ohos-pasteboard-binding.workspace = true
ohos-udmf-binding.workspace = true
ohos-native-window-binding.workspace = true
ohos-xcomponent-binding.workspace = true
ohos-avplayer-binding.workspace = true
glow.workspace = true
khronos-egl.workspace = true
ohos-hilog-binding.workspace = true
ohos-net-connection-binding.workspace = true
ohos-vibrator-binding.workspace = true
log.workspace = true
thiserror.workspace = true
serde_json.workspace = true
ureq.workspace = true
ttf-parser.workspace = true
base64.workspace = true
percent-encoding.workspace = true
unicode-segmentation.workspace = true
rustc-hash.workspace = true

[build-dependencies]
napi-build-ohos.workspace = true

[dev-dependencies]
getrandom = { workspace = true, features = ["std"] }
log.workspace = true
nsh-core = { workspace = true, features = ["shader"] }
unicode-segmentation.workspace = true
nsh-engine.workspace = true
serde_json.workspace = true
