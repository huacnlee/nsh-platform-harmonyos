[package]
name = "nsh-platform-harmonyos-cli"
description = "`nsh-platform-harmonyos`: the `harmonyos` target of the nsh command line (`nsh package --target harmonyos`)."
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true

[lints]
workspace = true

[[bin]]
name = "nsh-platform-harmonyos"
path = "src/main.rs"

[dependencies]
anyhow.workspace = true
quick-xml.workspace = true
serde_json.workspace = true
serde.workspace = true
nsh-core.workspace = true
nsh-engine = { workspace = true, features = ["js"] }
nsh-base.workspace = true
nsh-dev = { workspace = true, features = ["server"] }
nsh-testing = { workspace = true, features = ["bundle", "agent"] }
image.workspace = true
ctrlc.workspace = true
