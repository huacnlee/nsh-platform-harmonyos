[package]
name = "nsh-platform-harmonyos"
description = "The `harmonyos` target of Native Shell, as a platform nshm: `nsh add nsh-platform-harmonyos`, then `nsh run --target harmonyos`."
version = "0.1.1"
keywords = ["nshm", "harmonyos", "openharmony", "nsh"]
edition.workspace = true
license.workspace = true
repository.workspace = true

[lints]
workspace = true

# The ArkUI backend (`src/lib.rs`), built for OHOS into the app's
# `libnsh_platform_harmonyos.so` by the runner; empty on other targets.
[lib]
path = "src/lib.rs"

# The platform's program `nsh` runs for `--target harmonyos`.
[[bin]]
name = "nsh-platform-harmonyos"
path = "src/main.rs"

[features]
# None by default: the CLI builds for the computer without them, and the
# runner it writes asks for `backend` (with `dev`, `api-23` or `api-26` as
# the app needs).
default = []
# What the HarmonyOS library is built with.
backend = ["editor", "emoji-picker", "highlight", "math", "plot", "rich-editor", "term", "zlib", "crypto"]
dev = ["dep:nsh-dev", "dep:nsh-testing", "dep:url"]
# The large parts of `nsh/base`, as NSH's Android and iOS backends name them.
# An app that imports one the library was built without fails at the import,
# naming it.
# `Editor` and `DiffView`, with ropey and imara-diff.
editor = ["nsh-base/editor"]
# `RichEditor`, its schema, session and plugin classes.
rich-editor = ["nsh-base/rich-editor"]
# The charts: `nsh/base/plot`.
plot = ["nsh-base/plot"]
# `Terminal` and its emulator: `vte`.
term = ["nsh-base/term"]
# Highlighted code in `TextView` and the `Editor` (syntect). Without it, plain.
highlight = ["nsh-base/highlight"]
# `TextView`'s formulas typeset natively (RaTeX and the KaTeX fonts). Without
# it a formula shows as its TeX, or as the app's `renderMath`.
math = ["nsh-base/math"]
# `EmojiPicker`, with Unicode's emoji and their English names (about 440 kB).
emoji-picker = ["nsh-base/emoji-picker"]
# The standard JS module `zlib`: deflate, gzip, brotli and zstd.
zlib = ["nsh-engine/zlib"]
# The standard JS module `crypto` and the globals of Web Crypto.
crypto = ["nsh-engine/crypto"]
# Linked enhancements raise the minimum supported runtime API.
api-23 = [
  "ohos-arkui-binding/accessibility",
  "ohos-arkui-binding/api-23",
  "dep:ohos-accessibility-binding",
  "ohos-accessibility-binding/api-23",
  "ohos-audio-binding/api-23",
  "ohos-avplayer-binding/api-23",
  "ohos-multi-modal-input-binding/api-23",
]
api-26 = [
  "api-23",
  "ohos-arkui-binding/api-26",
  "ohos-audio-binding/api-26",
  "ohos-avplayer-binding/api-26",
  "ohos-multi-modal-input-binding/api-26",
]

# The CLI, on the computer.
[target.'cfg(not(target_env = "ohos"))'.dependencies]
anyhow.workspace = true
quick-xml.workspace = true
serde_json.workspace = true
serde.workspace = true
nsh-core.workspace = true
nsh-engine = { workspace = true, features = ["js"] }
nsh-base.workspace = true
nsh-dev = { workspace = true, features = ["server"] }
nsh-testing = { workspace = true, features = ["bundle", "agent"] }
image.workspace = true
ctrlc.workspace = true

# The backend, on the device.
[target.'cfg(target_env = "ohos")'.dependencies]
nsh-core = { workspace = true, features = ["svg", "shader", "glsl"] }
getrandom = { workspace = true, features = ["std"] }
nsh-package.workspace = true
nsh-dev = { workspace = true, features = ["client"], optional = true }
nsh-testing = { workspace = true, features = ["agent"], optional = true }
url = { workspace = true, optional = true }
nsh-engine = { workspace = true, features = ["js"] }
nsh-base.workspace = true
napi-ohos.workspace = true
napi-derive-ohos.workspace = true
tokio = { workspace = true, features = ["rt", "time"] }
ohos-arkui-binding = { workspace = true, features = ["image", "udmf"] }
ohos-accessibility-binding = { workspace = true, optional = true }
ohos-device-binding.workspace = true
ohos-display-binding.workspace = true
ohos-drawing-binding.workspace = true
ohos-native-image-binding.workspace = true
ohos-resource-manager-binding.workspace = true
ohos-vsync-binding.workspace = true
ohos-web-binding.workspace = true
ohos-window-manager-binding.workspace = true
ohos-image-native-binding.workspace = true
ohos-pasteboard-binding.workspace = true
ohos-udmf-binding.workspace = true
ohos-native-window-binding.workspace = true
ohos-xcomponent-binding.workspace = true
ohos-avplayer-binding.workspace = true
ohos-audio-binding.workspace = true
ohos-multi-modal-input-binding.workspace = true
glow.workspace = true
khronos-egl.workspace = true
ohos-hilog-binding.workspace = true
ohos-net-connection-binding.workspace = true
ohos-vibrator-binding.workspace = true
log.workspace = true
thiserror.workspace = true
serde.workspace = true
serde_json.workspace = true
ureq.workspace = true
ttf-parser.workspace = true
base64.workspace = true
percent-encoding.workspace = true
unicode-segmentation.workspace = true
rustc-hash.workspace = true

[build-dependencies]
napi-build-ohos.workspace = true

[dev-dependencies]
rustc-hash.workspace = true
getrandom = { workspace = true, features = ["std"] }
log.workspace = true
nsh-core = { workspace = true, features = ["shader"] }
unicode-segmentation.workspace = true
nsh-engine.workspace = true
serde.workspace = true
serde_json.workspace = true

[workspace]
resolver = "3"

[workspace.package]
edition = "2024"
license = "Apache-2.0"
repository = "https://github.com/huacnlee/nsh-platform-harmonyos"

[workspace.lints.rust]
missing_docs = "warn"
unreachable_pub = "deny"

[workspace.dependencies]
nsh-core = "0.6"
nsh-engine = { version = "0.6", default-features = false }
nsh-base = { version = "0.6", default-features = false }
nsh-package = "0.6"
nsh-dev = "0.6"
nsh-testing = { version = "0.6", default-features = false }
serde = { version = "1", features = ["derive"] }
image = { version = "0.25", default-features = false, features = ["png"] }
ctrlc = { version = "3", features = ["termination"] }

anyhow = "1"
base64 = "0.22"
getrandom = "0.3"
log = "0.4"
percent-encoding = "2.3"
quick-xml = { version = "0.42", features = ["serialize"] }
rustc-hash = "2.1"
serde_json = "1"
thiserror = "2"
tokio = { version = "1", default-features = false }
ttf-parser = "0.25"
unicode-segmentation = "1.13"
ureq = "3.1"
url = "2.5"
glow = "0.18"
khronos-egl = { version = "6", default-features = false, features = ["static", "no-pkg-config", "1_5"] }

# HarmonyOS / OpenHarmony: N-API and the NDK's C APIs.
napi-ohos = { version = "1.2.0", default-features = false, features = ["napi8", "serde-json", "tokio_rt"] }
napi-derive-ohos = "1.2.0"
napi-build-ohos = "1.2.0"
ohos-arkui-binding = { version = "0.6.3", default-features = false, features = ["napi", "drawing", "xcomponent", "api-20"] }
ohos-accessibility-binding = { version = "0.2.0", default-features = false, features = ["api-20"] }
ohos-display-binding = { version = "0.2.0", default-features = false, features = ["api-20"] }
ohos-device-binding = { version = "0.1.0", default-features = false }
ohos-drawing-binding = { version = "0.2.9", default-features = false, features = ["api-20"] }
ohos-native-image-binding = { version = "0.1.0", default-features = false, features = ["api-20"] }
ohos-resource-manager-binding = { version = "0.3.6", default-features = false, features = ["napi", "api-20"] }
ohos-vsync-binding = { version = "0.3.2", default-features = false, features = ["api-20"] }
ohos-web-binding = { version = "0.3.3", default-features = false, features = ["api-20"] }
ohos-window-manager-binding = { version = "0.1.2", default-features = false, features = ["input", "api-20"] }
ohos-image-native-binding = { version = "0.0.8", default-features = false, features = ["api-20"] }
ohos-pasteboard-binding = { version = "0.1.0", default-features = false, features = ["api-20"] }
ohos-udmf-binding = { version = "0.1.0", default-features = false, features = ["api-20"] }
ohos-avplayer-binding = { version = "0.1.1", default-features = false, features = ["api-20"] }
ohos-audio-binding = { version = "0.1.0", default-features = false, features = ["api-20"] }
ohos-multi-modal-input-binding = { version = "0.1.0", default-features = false, features = ["api-20"] }
ohos-xcomponent-binding = { version = "0.6", default-features = false, features = ["callbacks", "multi_mode", "api-20"] }
ohos-native-window-binding = { version = "0.3.3", default-features = false, features = ["api-20"] }
ohos-hilog-binding = { version = "0.2.5", features = ["log"] }
ohos-net-connection-binding = { version = "0.1.4", default-features = false }
ohos-vibrator-binding = { version = "0.2.4", default-features = false, features = ["api-20"] }

# NSH nightly: its crates from longbridge/nsh `main`, which `nsh update nightly`
# installs the CLI of. Cargo.lock pins the commit; `cargo update -p nsh-core`
# moves to the latest night. The runner of a TSX app takes this section too.
[patch.crates-io]
nsh-macros = { git = "https://github.com/longbridge/nsh", branch = "main" }
nsh-core = { git = "https://github.com/longbridge/nsh", branch = "main" }
nsh-base = { git = "https://github.com/longbridge/nsh", branch = "main" }
nsh-package = { git = "https://github.com/longbridge/nsh", branch = "main" }
nsh-js = { git = "https://github.com/longbridge/nsh", branch = "main" }
nsh-engine = { git = "https://github.com/longbridge/nsh", branch = "main" }
nsh-testing = { git = "https://github.com/longbridge/nsh", branch = "main" }
nsh-bundler = { git = "https://github.com/longbridge/nsh", branch = "main" }
nsh-dev = { git = "https://github.com/longbridge/nsh", branch = "main" }

[profile.release]
opt-level = 3
lto = "fat"
codegen-units = 1

[profile.dev.package.quickjs-jit-sys]
opt-level = 3
[profile.dev.package.taffy]
opt-level = 3
