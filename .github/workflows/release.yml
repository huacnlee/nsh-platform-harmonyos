name: Release

# Publishes the platform nshm the way an nshm is published (cargo publish,
# keyword `nshm`, `nsh.json` at the crate's version), with its backend
# first. Publishes the crates to crates.io: `nsh-platform-harmonyos-core` (the
# ArkUI backend library), then `nsh-platform-harmonyos` (the platform nshm).
#
# - Pushing a tag `vX.Y.Z` (the workspace version in Cargo.toml) publishes
#   that version.
# - Running it by hand releases the given tag; a dry run packages and
#   verifies every crate without uploading.
#
# A crate whose version is already on crates.io is skipped, so a run that
# failed half way can be run again.
#
# Needs the `CARGO_REGISTRY_TOKEN` secret.

on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      tag:
        description: "Tag to publish (e.g. v0.1.0)"
        required: true
        type: string
      dry-run:
        description: "Package and verify only, upload nothing"
        required: false
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: release
  cancel-in-progress: false

env:
  CARGO_TERM_COLOR: always
  TAG: ${{ inputs.tag || github.ref_name }}
  DRY_RUN: ${{ inputs.dry-run && '--dry-run' || '' }}

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ env.TAG }}
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2

      - name: Check the version
        run: |
          version=$(sed -n 's/^version = "\(.*\)"$/\1/p' Cargo.toml | head -1)
          if [[ "$TAG" != "v$version" ]]; then
            echo "::error::Tag $TAG does not match the workspace version $version"
            exit 1
          fi
          # An nshm's `nsh.json` version must be its crate's.
          nshm=$(sed -n 's/^ *"version": "\(.*\)",*$/\1/p' nsh.json)
          if [[ "$nshm" != "$version" ]]; then
            echo "::error::nsh.json version $nshm does not match the crate version $version"
            exit 1
          fi
          echo "VERSION=$version" >> "$GITHUB_ENV"

      - name: Publish
        env:
          CARGO_REGISTRY_TOKEN: ${{ secrets.CARGO_REGISTRY_TOKEN }}
        run: |
          for crate in nsh-platform-harmonyos-core nsh-platform-harmonyos; do
            status=$(curl -s -o /dev/null -w '%{http_code}' \
              -A "nsh-platform-harmonyos release (github.com/huacnlee/nsh-platform-harmonyos)" \
              "https://crates.io/api/v1/crates/$crate/$VERSION")
            if [[ "$status" == "200" && -z "$DRY_RUN" ]]; then
              echo "$crate $VERSION is already on crates.io, skipped"
              continue
            fi
            cargo publish -p "$crate" --locked $DRY_RUN
          done
